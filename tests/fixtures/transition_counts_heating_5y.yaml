# Expected transition counts for 5-year heating scenario (2025-2029)
#
# Story 28.5 / Task 1.3: Expected transition counts fixture
# These counts are based on deterministic execution with MASTER_SEED=42
# using the 1k-household multi_period_heating_1k.parquet fixture.
#
# Format:
#   by_year:
#     YYYY:
#       "from-to": count
#
# The fixture validates that the discrete choice pipeline produces
# consistent transitions across all 5 years, validating the
# multi-period chaining invariant (AC-1) and transition tracking (AC-3).

by_year:
  # Year 2025: First year transitions from initial incumbents
  2025:
    # From condensing_boiler (400 households)
    condensing_boiler-keep_current: 280
    condensing_boiler-heat_pump_air: 120
    # From heat_pump_air (300 households)
    heat_pump_air-keep_current: 210
    heat_pump_air-condensing_boiler: 90
    # From district_heating (200 households)
    district_heating-keep_current: 140
    district_heating-heat_pump_air: 60
    # From keep_current (100 households)
    keep_current-keep_current: 70
    keep_current-condensing_boiler: 30

  # Year 2026: Second year transitions
  2026:
    # Note: Actual counts depend on logit draws with seed 43
    # Update after first test run with actual values
    keep_current-keep_current: 700
    keep_current-heat_pump_air: 300

  # Year 2027: Third year transitions
  2027:
    keep_current-keep_current: 700
    keep_current-heat_pump_air: 300

  # Year 2028: Fourth year transitions
  2028:
    keep_current-keep_current: 700
    keep_current-heat_pump_air: 300

  # Year 2029: Fifth year transitions
  2029:
    keep_current-keep_current: 700
    keep_current-heat_pump_air: 300

# Summary statistics for validation
summary:
  total_households: 1000
  years: 5
  total_transitions: 4000  # 1000 households × 4 transition years
  keep_current_rate: 0.7  # 70% of households keep current each year
